[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experience-evaluation"
version = "0.1.0"
description = "Auditable A+B+C measurement engine for agent capability and multi-agent orchestration"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

